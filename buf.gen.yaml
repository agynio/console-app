version: v2
inputs:
  # Vendored ahead of buf.build/agynio/api; see proto/buf.yaml.
  - directory: proto
  - module: buf.build/agynio/api
    paths:
      - agynio/api/egress/v1
      - agynio/api/apps/v1
      - agynio/api/llm/v1
      - agynio/api/metering/v1
      - agynio/api/users/v1
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt: target=ts
    include_imports: true
