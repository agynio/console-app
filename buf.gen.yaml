version: v2
inputs:
  - module: buf.build/agynio/api
    paths:
      - agynio/api/agents/v1/agents.proto
      - agynio/api/gateway/v1/agents.proto
      - agynio/api/gateway/v1/images.proto
      - agynio/api/gateway/v1/organizations.proto
      - agynio/api/gateway/v1/runners.proto
      - agynio/api/gateway/v1/secrets.proto
      - agynio/api/images/v1/images.proto
      - agynio/api/organizations/v1/organizations.proto
      - agynio/api/runner/v1/runner.proto
      - agynio/api/runners/v1/runners.proto
      - agynio/api/secrets/v1/secrets.proto
      - agynio/api/egress/v1
      - agynio/api/apps/v1
      - agynio/api/llm/v1
      - agynio/api/metering/v1
      - agynio/api/users/v1
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt: target=ts
    include_imports: true
